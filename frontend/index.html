<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030405" />
    <meta name="color-scheme" content="dark" />

    <title>Score · Basketball Intelligence</title>
    <meta
      name="description"
      content="Editorial-grade basketball intelligence — schedule, standings, advanced player metrics and AI matchup prediction in a single cinematic dashboard."
    />
    <meta name="application-name" content="Score" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Score · Basketball Intelligence" />
    <meta
      property="og:description"
      content="Live schedule, advanced metrics and AI matchup prediction. Cinematic basketball intelligence."
    />
    <meta property="og:site_name" content="Score" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Score · Basketball Intelligence" />
    <meta
      name="twitter:description"
      content="Live schedule, advanced metrics and AI matchup prediction."
    />

    <!-- Favicon and icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23EE7E2A' stroke-width='1.5' stroke-linecap='round'%3E%3Crect width='24' height='24' fill='%23030405' rx='4'/%3E%3Ccircle cx='12' cy='12' r='8'/%3E%3Cpath d='M4 12h16M12 4v16M6 6c2 3 2 9 0 12M18 6c-2 3-2 9 0 12'/%3E%3C/svg%3E" />

    <!-- Performance: preconnect to external font CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.basketball-reference.com" />

    <!-- App boot — splash before React hydrates -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #030405;
        color: #f2ebdc;
        font-family: 'Geist', system-ui, -apple-system, sans-serif;
      }
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 100;
        background: radial-gradient(ellipse at center, #07080b, #030405);
        opacity: 1;
        transition: opacity 600ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .app-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash-mark {
        position: relative;
        width: 56px;
        height: 56px;
      }
      .app-splash-mark::before,
      .app-splash-mark::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #ee7e2a;
        animation: app-splash-spin 1.4s linear infinite;
      }
      .app-splash-mark::after {
        inset: 8px;
        border-top-color: rgba(238, 126, 42, 0.4);
        border-right-color: rgba(238, 126, 42, 0.2);
        animation-duration: 1s;
        animation-direction: reverse;
      }
      .app-splash-label {
        font-family: 'Geist', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #7e7868;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" class="app-splash">
      <div class="app-splash-mark" aria-hidden="true"></div>
      <div class="app-splash-label">Loading the floor</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash once main script is parsed and React mounts.
      window.addEventListener('load', function () {
        requestAnimationFrame(function () {
          const splash = document.getElementById('app-splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function () {
              splash.remove();
            }, 700);
          }
        });
      });
    </script>
  </body>
</html>
