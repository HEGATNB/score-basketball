services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/env}"
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build: ./backend
    env_file:
      - ./backend/env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_URL=
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/env}
      - FORWARDED_ALLOW_IPS=*
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  backend_models:
