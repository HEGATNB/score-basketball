services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Порт не публикуется наружу — доступ только из app_network; пароль обязателен.
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-score_redis_change_me}
    volumes:
      - redis_data:/data
    command: sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build: ./backend
    # Порт не публикуется наружу — доступ только через nginx.
    env_file:
      - ./backend/env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-score_redis_change_me}
    depends_on:
      - redis
    volumes:
      # Код не монтируется томом: образ собирается из Dockerfile (без --reload).
      - backend_models:/app/models
      - backend_backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  backend_models:
  backend_backups:
