services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - backend_models:/app/models
      - backend_backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  backend_models:
  backend_backups: