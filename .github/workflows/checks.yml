name: checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Backend (compile + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Syntax check
        run: python -m compileall backend
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip install --upgrade setuptools
          # PYSEC-2026-1805 (protobuf) is transitively pinned by tensorflow==2.16.1;
          # fixing it requires a TensorFlow upgrade, tracked separately.
          pip-audit --ignore-vuln PYSEC-2026-1805

  frontend:
    name: Frontend (build + npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Dependency audit (npm)
        # Audit shipped (production) dependencies only: the remaining high-severity
        # advisories are in build-time devDependencies (vite/esbuild/rollup/postcss/
        # browserslist chain) that are not part of the deployed bundle.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
